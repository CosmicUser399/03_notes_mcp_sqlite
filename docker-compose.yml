services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/notes.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/notes.db
    volumes:
      - sqlite_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  sqlite_data:
